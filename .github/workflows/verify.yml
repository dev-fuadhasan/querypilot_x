name: Verify QueryPilot X
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Numeric text SQL smoke test
        run: node tests/sql-smoke.cjs
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          SESSION_SECRET: temporary-build-check-only-secret-012345678901
