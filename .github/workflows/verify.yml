name: Verify QueryPilot X
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Numeric text SQL smoke test
        run: node tests/sql-smoke.cjs
      - name: Project session and switch regression tests
        run: node --experimental-strip-types --test tests/project-flow.test.mjs
      - name: Dataset-grounded clarification tests
        run: node --experimental-strip-types --test tests/value-check.test.mjs
      - name: Visualization intent regression tests
        run: node --experimental-strip-types --test tests/charts.test.mjs
      - name: Project-aware discovery and chart query tests
        run: node --experimental-strip-types --test tests/intelligence.test.mjs
      - name: SQL lexical safety and formatting tests
        run: node --experimental-strip-types --test tests/sql-guard.test.mjs
      - name: Real historical trend vs ranking tests
        run: node --experimental-strip-types --test tests/trend.test.mjs
      - name: Schema-adaptive temporal and ranking regression tests
        run: node --experimental-strip-types --test tests/temporal-analysis.test.mjs
      - name: All-tables scope and real dataset routing
        run: node --experimental-strip-types --test tests/table-routing.test.mjs
      - name: Verified binary outcome and category rate tests
        run: node --experimental-strip-types --test tests/rate-analysis.test.mjs
      - name: Responsive chart fidelity and verified rate comparison
        run: node --experimental-strip-types --test tests/visualization-data.test.mjs
      - name: Decimal result formatting regression tests
        run: node --experimental-strip-types --test tests/format-values.test.mjs
      - name: Scoped relationship analysis and contextual follow-up regression tests
        run: node --experimental-strip-types --test tests/relationship-analysis.test.mjs
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          SESSION_SECRET: temporary-build-check-only-secret-012345678901
